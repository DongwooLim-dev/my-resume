<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하루를 담다 · Daily Planner</title>
  <link rel="stylesheet" href="/planner/static/style.css">
  <script src="/planner/static/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/planner/">하루를 담다<span>DAILY PLANNER</span></a><a href="/" aria-label="메인페이지로 이동">← 메인</a><span class="private-label" id="access-label">공개 · 조회 전용</span></header>
    <main>
      <section class="intro"><p class="eyebrow">ONE DAY, ONE STEP</p><h1>작은 계획이 만드는<br>가벼운 하루.</h1><p>해야 할 일은 여기에, 마음의 여유는 당신에게.</p></section>
      <div class="layout">
        <aside class="sidebar">
          <section class="card date-card"><p class="eyebrow">YOUR DAY</p><label for="day">계획할 날짜</label><input id="day" type="date" required><div class="date-buttons"><button id="previous" type="button" aria-label="이전 날짜">←</button><button id="today" type="button">오늘</button><button id="next" type="button" aria-label="다음 날짜">→</button></div></section>
          <section class="card summary"><p class="eyebrow">DAILY PROGRESS</p><p class="percent" id="percent">0<span>%</span></p><progress id="progress" max="100" value="0" aria-label="완료율"></progress><p id="summary">오늘의 첫 계획을 적어 보세요.</p></section>
          <p class="storage-note" id="access-note">공개된 일정을 조회하는 공간입니다.<br>편집은 SSH 터널에서만 가능합니다.</p>
        </aside>
        <section class="workspace">
          <section class="card composer" id="composer" hidden><div class="section-heading"><h2>새로운 계획</h2><span>차근차근, 하나씩</span></div>
            <form id="task-form">
              <label class="sr-only" for="title">할 일</label><input id="title" placeholder="오늘은 무엇을 해볼까요?" maxlength="200" required autocomplete="off">
              <div class="form-row"><label>시작<input id="start-time" type="time"></label><label>종료<input id="end-time" type="time"></label><label>우선순위<select id="priority"><option value="normal">보통</option><option value="high">중요</option><option value="low">여유롭게</option></select></label><button class="primary" id="save" type="submit">＋ 계획 추가</button></div>
              <button id="cancel-edit" type="button" hidden>수정 취소</button>
            </form>
          </section>
          <section class="card task-section"><div class="section-heading"><h2 id="day-heading">오늘의 계획</h2><button id="refresh" type="button">새로고침</button></div><div class="filters" role="group" aria-label="할 일 필터"><button type="button" class="active" data-filter="all">전체</button><button type="button" data-filter="pending">진행 중</button><button type="button" data-filter="done">완료</button><button type="button" data-filter="archived">보관함</button></div><p id="message" role="status" aria-live="polite"></p><div id="tasks" aria-busy="false"></div></section>
        </section>
      </div>
    </main>
    <footer>완벽한 하루보다, 나다운 하루를.</footer>
  </div>
</body>
</html>
