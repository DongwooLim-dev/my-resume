# Public reads; writes require an actual loopback connection via SSH.
# Do not replace these controls with a Host-header-only check.
location = /planner {
    limit_except GET {
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $http_host;
    proxy_set_header X-Planner-Client $remote_addr;
}

location ^~ /planner/ {
    limit_except GET {
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $http_host;
    proxy_set_header X-Planner-Client $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
}
